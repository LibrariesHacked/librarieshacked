{% assign featured_projects = site.projects | where: "featured", true | sort: "order" %}
<div class="subtle-cards-grid">
  {% for item in featured_projects %}
    <div class="subtle-card" style="border-top-color: {{ item.color | default: '#0284c7' }};">
      {% if item.image %}
        <div class="card-media">
          <a href="{{ item.url }}">
            <img src="{{ item.image | relative_url }}" alt="{{ item.title }}" loading="lazy" />
          </a>
        </div>
      {% endif %}
      <div class="card-body">
        <div class="card-header">
          <h3 class="card-title"><a href="{{ item.url }}">{{ item.title }}</a></h3>
          <span class="card-meta">{{ item.year }}</span>
        </div>
        {% if item.tag %}
          <span class="card-badge" style="background-color: {{ item.color | default: '#0284c7' }};">{{ item.tag }}</span>
        {% endif %}
        <p class="card-desc">{{ item.description }}</p>
        <div class="card-link">
          <a href="{{ item.url }}">Visit project &rarr;</a>
        </div>
      </div>
    </div>
  {% endfor %}
</div>
