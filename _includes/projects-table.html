{% assign project_type = include.type | default: "core" %}
{% assign items = site.projects | where: "type", project_type | sort: "year" | reverse %}
<table>
  <thead>
    <tr>
      <th>Year</th>
      <th>Project</th>
      <th>Description</th>
    </tr>
  </thead>
  <tbody>
    {% for item in items %}
      <tr>
        <td>{{ item.year }}</td>
        <td><a href="{{ item.url }}">{{ item.title }}</a></td>
        <td>{{ item.description }}</td>
      </tr>
    {% endfor %}
  </tbody>
</table>
