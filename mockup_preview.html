<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px;
    height: 820px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #f8fafc;
    /* Light technical paper graph grid */
    background-image: 
      linear-gradient(to right, rgba(148, 163, 184, 0.14) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(148, 163, 184, 0.14) 1px, transparent 1px),
      linear-gradient(to right, rgba(148, 163, 184, 0.32) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(148, 163, 184, 0.32) 1px, transparent 1px);
    background-size: 20px 20px, 20px 20px, 100px 100px, 100px 100px;
    position: relative;
  }

  /* LibraryCommons Corner Logo */
  .corner-logo {
    position: absolute;
    top: 24px;
    left: 40px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 50;
  }
  .corner-logo svg { color: #671e7d; }
  .brand-text {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.3px;
    color: #671e7d;
  }
  .brand-qualifier {
    font-weight: 300;
    color: #0d522b;
  }

  /* Desktop Browser Frame: 740px wide x 706px high */
  .desktop-frame {
    position: absolute;
    top: 70px;
    left: 40px;
    width: 740px;
    height: 708px;
    background: #ffffff;
    border-radius: 10px;
    border: 1px solid rgba(148, 163, 184, 0.45);
    box-shadow: 0 14px 30px -8px rgba(15, 23, 42, 0.12), 0 2px 6px rgba(15, 23, 42, 0.04);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .chrome {
    height: 34px;
    background: #f1f5f9;
    border-bottom: 1px solid #e2e8f0;
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 10px;
    flex-shrink: 0;
  }
  .traffic { display: flex; gap: 6px; }
  .tdot { width: 9px; height: 9px; border-radius: 50%; }
  .tr { background: #f87171; border: 1px solid #ef4444; }
  .ty { background: #fbbf24; border: 1px solid #f59e0b; }
  .tg { background: #34d399; border: 1px solid #10b981; }

  .address {
    flex: 1;
    max-width: 420px;
    background: #ffffff;
    height: 22px;
    border-radius: 5px;
    border: 1px solid #cbd5e1;
    display: flex;
    align-items: center;
    padding: 0 10px;
    font-size: 11px;
    color: #475569;
    gap: 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }

  .desktop-screen {
    width: 740px;
    height: 672px;
    background: #ffffff;
    overflow: hidden;
  }
  .desktop-screen img {
    width: 740px;
    height: 672px;
    display: block;
  }

  /* Mobile Device: 316px wide x 640px high */
  .mobile-device {
    position: absolute;
    top: 105px;
    left: 830px;
    width: 316px;
    height: 640px;
    background: #1e293b;
    border-radius: 38px;
    padding: 8px;
    border: 1px solid #334155;
    box-shadow: 0 20px 42px -10px rgba(15, 23, 42, 0.2), 0 4px 10px rgba(15, 23, 42, 0.08);
  }

  .notch {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 68px;
    height: 15px;
    background: #0f172a;
    border-radius: 10px;
    z-index: 30;
  }

  .mobile-screen {
    width: 300px;
    height: 624px;
    border-radius: 30px;
    overflow: hidden;
    background: #ffffff;
  }
  .mobile-screen img {
    width: 300px;
    height: 624px;
    display: block;
  }
</style>
</head>
