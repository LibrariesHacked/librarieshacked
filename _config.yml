# Set theme
remote_theme: daviddarnes/alembic@main

# File excludes
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - "*.ps1"
  - "*.py"

# Set plugins
plugins:
  - jekyll-sitemap
  - jekyll-mentions
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-commonmark
  - jekyll-include-cache
  - jemoji
  - jekyll-remote-theme

# Site settings & SEO
lang: "en-GB"
timezone: "Europe/London"
url: "https://www.librarieshacked.org"
baseurl: ""
title: "Libraries Hacked"
short_name: "Libraries Hacked"
description: "Promoting open data, developing digital tools, and showcasing prototypes for UK public libraries."
permalink: pretty
logo: "/assets/images/logo_small.webp"
image: "/assets/images/og-image.png"
repo: "https://github.com/davebathnes/librarieshacked"
email: "info@librarieshacked.org"
excerpt_separator: "<!-- more -->"

# Author & Social metadata
author:
  name: "Dave Rowe"
  email: "info@librarieshacked.org"

twitter:
  username: librarieshacked
  card: summary_large_image

social:
  name: Libraries Hacked
  links:
    - https://www.instagram.com/librarieshacked
    - https://www.linkedin.com/company/librarieshacked/
    - https://github.com/librarieshacked

# Site favicons & manifest icons (Alembic)
theme_color: "#0284c7"
favicons:
  16: "/assets/favicons/favicon-16x16.png"
  32: "/assets/favicons/favicon-32x32.png"
  96: "/assets/favicons/favicon-96x96.png"
  120: "/assets/favicons/apple-touch-icon.png"
  144: "/assets/favicons/android-chrome-144x144.png"
  180: "/assets/favicons/apple-touch-icon.png"
  192: "/assets/favicons/android-chrome-192x192.png"
  512: "/assets/favicons/android-chrome-512x512.png"

# Sass compression
sass:
  style: compressed

# Pagination
paginate: 5
paginate_path: news/page:num

# Header nav
navigation_header:
  - title: Home
    url: /
  - title: Projects
    url: /projects/
  - title: News
    url: /news/
  - title: About
    url: /about/

# Collections
collections:
  posts:
    title: News
    output: true
    description: "Press releases and announcements from Libraries Hacked"

# Collection settings
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post

navigation_footer:
  - title: "About"
    url: /about/
  - title: "Projects"
    url: /projects/
  - title: "Privacy"
    url: /privacy/
  - title: "Accessibility"
    url: /accessibility/
  - title: "GitHub"
    url: https://github.com/librarieshacked

social_links:
  LinkedIn: https://www.linkedin.com/company/librarieshacked/
  GitHub: https://github.com/librarieshacked
  Instagram: https://www.instagram.com/librarieshacked
  RSS: https://blog.librarydata.uk/feed.xml

sharing_links:
  LinkedIn: true
  Twitter: "#0284c7"
  Email: true

# Fonts
fonts:
  preconnect_urls:
    - https://fonts.gstatic.com
  font_urls:
    - https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap

service_worker: false
